name: APK Android

# Se lance à chaque envoi sur une branche android-enveloppe*, sur main quand l'enveloppe ou le site change, ou à la main (onglet Actions).
# Le fichier obtenu est un APK de test (non signé pour la boutique).
on:
  push:
    branches: ['android-enveloppe*', main]
    paths: ['android-app/**', 'index.html', 'sw.js', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Tests du moteur et du pont
        working-directory: android-app
        run: |
          node test/pointage-auto.test.js
          node test/caso-auto.test.js

      - name: Installer Capacitor
        working-directory: android-app
        run: npm install

      - name: Préparer le site casô
        working-directory: android-app
        run: node scripts/prepare-web.js

      - name: Créer le projet Android
        working-directory: android-app
        run: npx cap add android

      - name: Ajouter le pointage automatique
        working-directory: android-app
        run: node scripts/patch-android.js

      - name: Synchroniser
        working-directory: android-app
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: caso-android-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
