name: Contrôle de l'IA

# Chaque lundi matin (et à la main, onglet Actions) : le bilan de toute l'IA (commandes, exemples dans les 10 langues,
# questions du métier, fautes de frappe, avec des seuils), puis les essais dans l'appli et dans le module 3D (navigateur). Si quelque chose a changé, le contrôle échoue et GitHub prévient par e-mail ;
# le détail est dans le résumé du contrôle.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['chat/**', 'index.html', 'outils/chat/**', 'outils/ia/**']

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Bilan de l'IA (commandes, métier, fautes) avec seuils
        run: node outils/ia/bilan.js

      - name: Navigateur pour l'essai dans l'appli
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Essai du chat dans l'appli
        run: |
          python3 -m http.server 8767 >/dev/null 2>&1 &
          sleep 2
          node outils/chat/essai-appli.js http://localhost:8767/index.html

      - name: Essai du chat du module 3D
        run: |
          (python3 -m http.server 8767 >/dev/null 2>&1 &) || true
          sleep 1
          node outils/ia/essai-3d.js http://localhost:8767/index.html
