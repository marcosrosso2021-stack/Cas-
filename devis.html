<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2ef">
<title>casô · Devis</title>
<style>
:root{--bg:#f2f2ef;--card:#fbfbfa;--soft:#f0f0ed;--ink:#18181a;--mut:#6b6b70;--line:#e2e2de;--acc:#ffc21a;--ok:#16854a;--ko:#c62828;--warn:#b45309;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--lift:0 0 0 1px #0000000a,0 1px 1px -.5px #0000000d,0 3px 3px -1.5px #0000000d,0 8px 8px -4px #0000000a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--card:#131313;--soft:#1b1b1b;--ink:#e6e6e6;--mut:#8c8c8c;--line:#262626;--lift:inset 0 1px 0 0 #ffffff0a,0 0 0 1px #00000026,0 6px 6px -3px #00000030;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.35;font-variant-numeric:tabular-nums;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
body.embed header,body.embed nav{display:none}body.embed{padding-bottom:0}
[hidden]{display:none!important}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);font-size:22px;font-weight:500}
header svg.tile{width:38px;height:38px;cursor:pointer}
header .ttl{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;border:0;background:none;color:var(--mut);font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
nav button .pill{width:54px;height:30px;border-radius:15px;display:grid;place-items:center}
nav button.on{color:var(--ink)}
nav button.on .pill{background:var(--acc);color:#18181a}
section{display:none;padding:16px;max-width:640px;margin:0 auto}
section.on{display:block}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--lift)}
.card h3{margin:0 0 10px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
label{display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;min-height:48px;padding:11px 13px;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;height:48px;line-height:24px}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:24px}
input[type=date]::-webkit-calendar-picker-indicator{margin:0}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ink)}
input[type=color]{width:48px;padding:3px}
input.bad{border-color:var(--ko)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;border:0;border-radius:14px;background:var(--acc);color:#18181a;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.985)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;min-height:40px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.4}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;flex:none;padding:0;cursor:pointer}
.ib.ko{color:var(--ko)}
.mut{color:var(--mut);font-size:14px}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:38px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--mut);font:inherit;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#18181a}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:#fff;background:#6f7b8c}
.tag.envoye{background:#1f5fbf}.tag.valide{background:var(--ok)}.tag.retracte{background:var(--ko)}
.lst{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--lift);margin-bottom:12px}
.it{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.lst>:last-child{border-bottom:0}
.it[data-sw]{touch-action:pan-y}
.swp{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}.lst>.swp:last-child{border-bottom:0}
.swp>.it{position:relative;z-index:1;background:var(--card);border-bottom:0;transition:transform .22s ease}
.swp.drag>.it{transition:none}
.swp-del{position:absolute;top:0;bottom:0;right:0;width:76px;border:0;background:#e5484d;color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s}
.swp.drag .swp-del,.swp.open .swp-del{opacity:1}.swp-del .i{stroke:#fff}
[dir=rtl] .swp-del{right:auto;left:0}
.it .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.it .tx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .am{font-family:var(--mono);font-weight:600;white-space:nowrap}
.grp{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 8px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.grp .cnt{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.empty{padding:22px 16px;text-align:center;color:var(--mut)}
.cmp{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:22px;padding:6px 6px 6px 16px;box-shadow:var(--lift);margin-bottom:8px}
.cmp input{border:0;background:transparent;min-height:42px;padding:0;border-radius:0}
.cmp input:focus-visible{outline:0}
.cmp button{width:44px;height:44px;border:0;border-radius:50%;background:var(--acc);color:#18181a;display:grid;place-items:center;flex:none;cursor:pointer}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{display:flex;flex-direction:column;gap:8px;padding:8px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--lift);color:inherit;font:inherit;text-align:start;cursor:pointer;min-width:0}
.mc:active{transform:scale(.985)}
.mc b{font-size:14px;line-height:1.25;padding:0 4px 4px}
.th{height:190px;overflow:hidden;border-radius:10px;background:#fff;box-shadow:0 0 0 1px #00000014;position:relative}
.pg>.cvd{--pt:24px;--px:18px;padding:var(--pt) var(--px) 28px}
.th>.cvd{position:absolute;top:0;left:0;width:520px;padding:22px 24px;transform:scale(var(--k,.3));transform-origin:0 0;pointer-events:none}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.lgo{display:flex;align-items:center;gap:12px}
.lgo .pv{width:96px;height:56px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.lgo .pv img{max-width:100%;max-height:100%;object-fit:contain}
.lgo .btn{flex:1;margin:0}
.sw{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid var(--card);background:var(--c);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.slot{border:1.5px dashed var(--line);border-radius:12px;min-height:72px;display:grid;place-items:center;color:var(--mut);font-size:13px;overflow:hidden}
.slot img{max-height:70px;max-width:100%}
.slot .sp-v{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 10px 4px;max-width:100%}.slot .sp-v img{min-width:0}.slot .sp-q{width:64px;height:64px;flex:none}
.slot .sp-id{display:block;text-align:center;padding:0 0 8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.04em}
.tg{display:flex;align-items:center;gap:10px;margin-top:12px;font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink)}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;border-bottom:1px solid var(--line);background:var(--card)}
.bar .tl{flex:1;min-width:0;line-height:1.2}
.bar .tl b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tl span{display:block;font-size:12px;color:var(--mut);font-family:var(--mono)}
.stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px;overscroll-behavior:contain}
.stage>.in{max-width:640px;margin:0 auto}
.dock{display:flex;align-items:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.dock .tt{flex:1;min-width:0;line-height:1.15}
.dock .tt small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.dock .tt b{font-size:20px;font-family:var(--mono)}
.dock .btn{width:auto;flex:none}
.bdg{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.bdg.ko{border-color:var(--ko);color:var(--ko)}.bdg.warn{border-color:var(--warn);color:var(--warn)}.bdg.ok{color:var(--ok)}
.ln{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--card)}
.ln .q{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr;gap:6px;margin-top:6px}
.ln .q label{margin:0;font-size:10px}
.ln .q input,.ln .q select{min-height:44px;padding:8px;font-size:16px}
.ln .ft{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.ln .ft .tl{margin-left:auto;font-family:var(--mono);font-weight:700}
.ln .tgl{min-height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ln .tgl.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ln.inc{border-color:var(--warn)}
.ln.lsec{background:var(--soft);border-style:dashed}
.ln.lsec input{font-weight:700}
.ln.lopt{border-style:dashed}
.sugl{background:var(--card);border-radius:12px;box-shadow:var(--lift);margin-top:6px;overflow:hidden}
.sugl button{display:block;width:100%;padding:11px 13px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;font-size:16px;text-align:start;cursor:pointer}
.sugl button:last-child{border:0}
.sh-bg{position:fixed;inset:0;z-index:40;background:#00000073}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;box-shadow:0 -10px 40px #00000040}
.sh .gr{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.iss{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.iss .d{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ko)}
.iss.warn .d{background:var(--warn)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pg{background:#fff;color:#141414;border-radius:8px;box-shadow:0 0 0 1px #0000000f,0 12px 32px #0000001f;padding:0;overflow:hidden;max-width:820px;margin:0 auto}
/* document (devis) : couleurs pilotées par le logo */
.cvd,.pg,.th{direction:ltr}
.cvd{--cv-ac:#ffc21a;--cv-ink:#18181a;--cv-al:#c99700;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;color:#141414;background:#fff;text-align:left;container-type:inline-size}
.cvd .cvb{margin:0 0 16px}
.cvd p{margin:0 0 6px}
.cvd .cv-h{display:inline-block;font-size:1.05em;font-weight:700;margin:0 0 8px;padding-bottom:3px;border-bottom:2px solid var(--cv-al)}
.cvd .cv-head{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-start}
.cvd .cv-head.band{padding:18px 20px;border-radius:8px;background:var(--cv-ac);color:var(--cv-ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cvd .cv-head.band .cv-lg{color:inherit;opacity:.85}
.cvd .cv-head.al-c{flex-direction:column;align-items:center;text-align:center}
.cvd .cv-head.al-c .cv-hl{flex-direction:column;align-items:center}
.cvd .cv-hl{display:flex;gap:14px;align-items:flex-start;min-width:0;flex:1 1 220px}
.cvd .cv-logo{max-height:64px;max-width:140px;object-fit:contain;border-radius:4px}
.cvd .cv-nm{font-size:1.3em;font-weight:800;line-height:1.15;margin-bottom:3px}
.cvd .cv-ti{min-width:0;text-align:right}
.cvd .al-c .cv-ti{text-align:center}
.cvd .cv-tt{font-size:1.45em;font-weight:800;letter-spacing:.03em;line-height:1.15;margin-bottom:3px}
.cvd .cv-cap{font-size:.72em;text-transform:uppercase;letter-spacing:.09em;color:#666;font-weight:700;margin-bottom:3px}
.cvd .cv-cli{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#f6f6f3;border-radius:8px;padding:12px 14px;border-left:3px solid var(--cv-al)}
.cvd .cv-big{font-weight:700;font-size:1.08em}
.cvd .cvt{width:100%;border-collapse:collapse;font-size:.92em}
.cvd .cvt th{text-align:left;font-size:.78em;text-transform:uppercase;letter-spacing:.05em;padding:8px 6px;border-bottom:2px solid var(--cv-al);color:#333;font-weight:700}
.cvd .cvt td{padding:8px 6px;border-bottom:1px solid #e4e4e0;vertical-align:top}
.cvd .cvt .r{text-align:right;white-space:nowrap}
.cvd .cvt tr{break-inside:avoid}
.cvd .cv-sub{font-size:.85em;color:#666}
.cvd .cv-tot{display:flex;justify-content:flex-end}
.cvd .cv-tb{min-width:58%}
.cvd .cv-tr{display:flex;justify-content:space-between;gap:14px;padding:3px 0}
.cvd .cv-tr.sm{font-size:.9em;color:#555}
.cvd .cv-tr.big{font-size:1.22em;border-top:2px solid var(--cv-al);margin-top:5px;padding-top:8px}
.cvd .cv-lg{font-size:.8em;color:#555;line-height:1.5}
.cvd .cv-box{background:color-mix(in srgb,var(--cv-ac) 12%,#fff);border:1px solid color-mix(in srgb,var(--cv-ac) 45%,#fff);border-radius:8px;padding:10px 12px}
.cvd .cv-sg{display:grid;grid-template-columns:1fr 1fr;gap:18px;break-inside:avoid}
.cvd .cv-sz{height:74px;border:1px dashed #c9c9c9;border-radius:8px;margin-top:4px;display:grid;place-items:center;overflow:hidden}
.cv-sq{display:flex;align-items:center;gap:8px;margin-top:6px}.cv-sq img{width:54px;height:54px}.cv-sq span{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#666;letter-spacing:.04em}
.cvd .cv-sz img{max-height:70px;max-width:100%}
.cvd .cv-ck{display:flex;gap:8px;align-items:flex-start;font-size:.85em;margin:4px 0}
.cvd .cv-ck i{width:14px;height:14px;border:1.5px solid #888;border-radius:3px;flex:none;margin-top:2px}
.cvd .cv-ph{opacity:.55}
.cvd .cvt .cv-sec td{font-weight:700;padding-top:12px;color:var(--cv-al);border-bottom:1px solid var(--cv-al);background:none!important}
.cvd .cvt .cv-st td{font-size:.9em;color:#555;text-align:right;background:none!important}
.cvd .cvt .cv-opt td{color:#666}
.cvd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* ---- modèles esthétiques : paramètres combinables ---- */
.cvd{--cv-r:4px;--cv-pp:#fff}.cvd.r1{--cv-r:12px}
.cvd .cv-head.band,.cvd .cv-cli,.cvd .cv-box,.cvd .cv-sz{border-radius:var(--cv-r)}
.cvd.k-creme{background:#faf6ee;--cv-pp:#faf6ee}
.cvd.f-serif{font-family:Georgia,"Times New Roman",serif}
.cvd.f-didot{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,serif}
.cvd.f-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px}
.cvd.f-round{font-family:"Avenir Next",Avenir,Nunito,"Trebuchet MS",sans-serif}
.cvd.f-grot{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.cvd.f-serif .cv-cap,.cvd.f-didot .cv-cap,.cvd.f-serif .cvt th,.cvd.f-didot .cvt th{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.14em;font-weight:600}
.cvd.f-serif .cv-nm,.cvd.f-didot .cv-nm{font-weight:400;font-size:1.5em;letter-spacing:.02em}
.cvd.f-grot .cv-nm{letter-spacing:-.02em}
.cvd.z1{font-size:12.5px;line-height:1.35}.cvd.z1 .cvb{margin-bottom:10px}.cvd.z1 .cv-logo{max-height:44px}.cvd.z1 .cvt td{padding:4px 5px}.cvd.z1 .cvt th{padding:5px}
/* en-tête */
.cvd .cv-head.grad{background:linear-gradient(120deg,var(--cv-ac),var(--cv-a2));color:var(--cv-ink);padding:18px 20px;border-radius:var(--cv-r)}
.cvd .cv-head.grad .cv-lg{color:inherit;opacity:.9}
.cvd .cv-head.band .cv-tt,.cvd .cv-head.grad .cv-tt{color:inherit!important}
.cvd .cv-head.title .cv-ti{order:-1;flex-basis:100%;text-align:left;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1.5px solid #141414;padding-bottom:8px}
.cvd .cv-head.title .cv-tt{font-size:3em;line-height:1;letter-spacing:-.03em;margin:0}
.cvd .cv-head.boxt .cv-ti{background:var(--cv-ac);color:var(--cv-ink);padding:12px 16px;border-radius:var(--cv-r)}
.cvd .cv-head.boxt .cv-ti .cv-lg{color:inherit;opacity:.85}
.cvd.hb-fin .cv-head{border-bottom:1px solid var(--cv-al);padding-bottom:14px}
.cvd.hb-epais .cv-head{border-bottom:2px solid var(--cv-ac);padding-bottom:10px}
/* titre */
.cvd.tt-espace .cv-tt{font-size:.95em;font-weight:700;letter-spacing:.34em;color:var(--cv-al)}

const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const lum=h=>{const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function hsl2hex(h,s,l){const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return rgb2hex(f(0)*255,f(8)*255,f(4)*255)}
function theme(){const ac=/^#[0-9a-f]{6}$/i.test(S.profil.couleur)?S.profil.couleur:'#ffc21a';const l=lum(ac);const ink=l>.42?'#18181a':'#ffffff';let al=ac;if(l>.35){const [h,s]=rgb2hsl(...hex2rgb(ac));al=hsl2hex(h,Math.max(s,.35),.4)}const [h0,s0,l0]=rgb2hsl(...hex2rgb(ac));const a2=hsl2hex((h0+38)%360,Math.max(s0,.45),Math.min(.62,Math.max(.32,l0)));return{ac,ink,al,a2}}
function themeStyle(){const t=theme();return `--cv-ac:${t.ac};--cv-ink:${t.ink};--cv-al:${t.al};--cv-a2:${t.a2}`}
function extraire(img){
  const W=64,r=img.naturalWidth/img.naturalHeight||1,c=document.createElement('canvas');
  c.width=r>=1?W:Math.max(8,Math.round(W*r));c.height=r>=1?Math.max(8,Math.round(W/r)):W;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);
  const px=x.getImageData(0,0,c.width,c.height).data,bins={};let ar=0,ag=0,ab=0,an=0;
  for(let i=0;i<px.length;i+=4){if(px[i+3]<128)continue;const R=px[i],G=px[i+1],B=px[i+2],[h,s,l]=rgb2hsl(R,G,B);
    if(l<.97&&l>.04){ar+=R;ag+=G;ab+=B;an++}
    if(l>.93||l<.08||s<.22)continue;const k=Math.round(h/24)%15,w=s*(1-Math.abs(l-.5));const b=bins[k]||(bins[k]={w:0,r:0,g:0,b:0,h});b.w+=w;b.r+=R*w;b.g+=G*w;b.b+=B*w}
  const arr=Object.values(bins).sort((a,b)=>b.w-a.w),out=[];
  for(const b of arr){const hx=rgb2hex(b.r/b.w,b.g/b.w,b.b/b.w),h=b.h;if(out.every(o=>{const d=Math.abs(o.h-h);return Math.min(d,360-d)>=36}))out.push({hx,h})}
  let res=out.slice(0,3).map(o=>o.hx);
  if(!res.length&&an)res=[rgb2hex(ar/an,ag/an,ab/an)];

}
function chargerImage(src){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src})}

function ligneHT(l){return l.sec?0:Math.round(num(l.qte)*cents(l.pu))}
const compte=l=>!l.sec&&!l.opt;
const sansTVA=d=>!!S.profil.franchise||!!(d&&d.autoliq);
function totaux(d){
  const fr=!!S.profil.franchise,al=!fr&&!!d.autoliq,par={};let ht=0,opt=0;
  (d.lignes||[]).forEach(l=>{if(l.sec)return;const t=ligneHT(l);if(l.opt){opt+=t;return}const r=fr||al?0:num(l.tva);ht+=t;par[r]=(par[r]||0)+t});
  let tva=0;const detail=Object.keys(par).map(Number).sort((a,b)=>b-a).map(r=>{const v=Math.round(par[r]*r/100);tva+=v;return{taux:r,base:par[r],tva:v}});

const taux2=l=>S.profil.franchise?0:num(l.tva);
const ttcUnit=l=>Math.round(cents(l.pu)*(1+taux2(l)/100));

function incomplete(l,d){if(l.sec)return false;return !has(l.des)||(d&&d.format==='bpu'?false:num(l.qte)<=0)||!has(l.unite)||!has(l.pu)}

function controle(d){
  const p=S.profil,out=[],ko=(t,go)=>out.push({lvl:'ko',txt:t,go}),wn=(t,go)=>out.push({lvl:'warn',txt:t,go}),part=d.client.type!=='pro',cat=CAT(d.categorie);
  besoin(p).filter(k=>k!=='tel'&&k!=='mediateur'&&k!=='assur').forEach(k=>{if(!has(p[k]))ko('Entreprise · '+LBL[k],{p:k})});
  if(!has(p.assur)&&!has(p.rcpro))ko('Entreprise · '+LBL.assur,{p:'assur'});
  else if(cat.dec&&!has(p.assur))ko('Entreprise · '+LBL.assur,{p:'assur'});
  if(has(p.assur)&&!has(p.zone))ko('Entreprise · '+LBL.zone,{p:'zone'});
  if(part&&!has(p.mediateur))ko('Entreprise · '+LBL.mediateur,{p:'mediateur'});
  if(!has(p.tel)&&!has(p.email))wn('Entreprise · Contact',{p:'tel'});
  if(!has(d.client.nom))ko('Client',{f:'cNom'});
  if(!has(d.client.chantier)&&!has(d.client.adr))ko('Adresse des travaux',{f:'cChan'});
  if(!d.lignes.some(l=>!l.sec))ko('Lignes',{f:'add'});
  const inc=d.lignes.map((l,i)=>incomplete(l,d)?i:-1).filter(i=>i>=0);
  if(d.autoliq&&part)ko('Autoliquidation : client pro',{f:'ctype'});
  if(d.avenant&&!has(d.avenant.num))ko('Avenant · devis initial',{f:'aNum'});
  if(inc.length)ko('Lignes · '+inc.length+' à compléter',{l:inc[0]});
  if(!(num(d.validiteJ)>0))ko('Validité',{f:'dVal'});
  if(!has(d.debut)||!has(d.duree))ko('Début et durée',{f:has(d.debut)?'dDur':'dDeb'});
  if(!d.acompteType)ko('Versement',{f:'acc'});
  else if(d.acompteType!=='Aucun'&&!(num(d.acomptePct)>0&&num(d.acomptePct)<=100))ko('Versement · %',{f:'dPct'});
  if(d.payant&&!(num(d.payantMontant)>0))ko('Devis payant · montant',{f:'dPay'});
  const fournisSansRef=d.lignes.findIndex(l=>l.fourni&&!has(l.ref));
  if(fournisSansRef>=0)wn('Fourni · marque, référence',{l:fournisSansRef});
  const ver=d.lignes.findIndex(l=>l.verif);
  if(ver>=0)wn('Quantité à vérifier',{l:ver});
  if(distanceActive(d)&&has(d.debut)&&d.debut<addDays(today(),14))wn('Début avant 14 j : demande du client',{f:'dDeb'});
  return out;
}

  if(f)l.push(E(f));if(has(p.adr))l.push(E(p.adr));
  const c=[p.tel,p.email].filter(has).join(' · ');if(c)l.push(E(c));
  if(has(p.siret))l.push('SIRET '+E(p.siret));if(has(p.rm))l.push(E(p.rm));
  if(!p.franchise&&has(p.tvai))l.push('TVA '+E(p.tvai));
  return l.length?l.join('<br>'):(ap?'<span class="cv-ph">Votre entreprise</span>':'');
}
function conditions(d){

async function lireClients(){if(hooks.getClients){try{const c=await hooks.getClients();if(Array.isArray(c))return c}catch(e){}}return S.clients}
async function trouverClient(q){
  if(hooks.findClient){try{const r=await hooks.findClient(q);if(r)return r}catch(e){}}
  const cs=await lireClients();
  const sc=cs.map(c=>({c,s:sim(q,c.nom)})).filter(x=>x.s>=.72).sort((a,b)=>b.s-a.s);
  if(!sc.length)return{client:null,score:0,candidats:[]};
  const ambigu=sc.length>1&&sc[1].s>=sc[0].s-.08&&sc[0].s<1;
  return{client:ambigu?null:sc[0].c,score:sc[0].s,candidats:sc.slice(0,4).map(x=>x.c),ambigu};
}
function upsertClient(c){
  if(!has(c.nom))return;
  let r=S.clients.find(x=>x.id&&x.id===c.id)||S.clients.find(x=>norm(x.nom)===norm(c.nom));
  if(!r){r={id:uid(),nom:c.nom,adr:c.adr||'',chantier:c.chantier||'',type:c.type||'part'};S.clients.push(r);c.id=r.id}
  else{Object.assign(r,{adr:c.adr||r.adr,chantier:c.chantier||r.chantier,type:c.type||r.type});c.id=r.id}
  saveC();if(hooks.saveClient)try{hooks.saveClient(clone(r||S.clients.find(x=>x.id===c.id)))}catch(e){}
}

let SWp=null;
function swFermer(ex){$$('.swp.open').forEach(w=>{if(w!==ex){w.classList.remove('open');w.firstChild.style.transform=''}})}
function swEnv(el){if(el.parentNode.classList.contains('swp'))return el.parentNode;const w=document.createElement('div');w.className='swp';el.parentNode.insertBefore(w,el);w.appendChild(el);
  const b=document.createElement('button');b.type='button';b.className='swp-del';b.setAttribute('aria-label',trS('Supprimer'));b.innerHTML=ico('trash');
  b.onclick=e=>{e.stopPropagation();swFermer();if(!confirm(trS('Supprimer ce devis ?')))return;S.devis=S.devis.filter(x=>x.id!==el.dataset.id);saveD();refresh()};w.appendChild(b);return w}
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('#lst .it[data-sw]');if(!el){if(!(e.target.closest&&e.target.closest('.swp-del')))swFermer();return}
  SWp={el,x:e.clientX,y:e.clientY,dx:0,on:false,open:el.parentNode.classList.contains('open')};swFermer(el.parentNode)},true);
document.addEventListener('pointermove',e=>{if(!SWp)return;const dx=e.clientX-SWp.x,dy=e.clientY-SWp.y,rtl=document.documentElement.dir==='rtl',s=rtl?-1:1;
  if(!SWp.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){SWp=null;return}if(Math.abs(dx)<10)return;SWp.on=true;SWp.w=swEnv(SWp.el);SWp.w.classList.add('drag')}
  const v=Math.max(-110,Math.min(0,(SWp.open?-76:0)+dx*s));SWp.dx=v;SWp.el.style.transform=`translateX(${v*s}px)`},true);
function swFin(){if(!SWp)return;const p=SWp;SWp=null;if(!p.on)return;p.w.classList.remove('drag');const o=p.dx<-38,s=document.documentElement.dir==='rtl'?-1:1;
  p.w.classList.toggle('open',o);p.el.style.transform=o?`translateX(${-76*s}px)`:'';
  const stop=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener('click',stop,{capture:true,once:true});setTimeout(()=>document.removeEventListener('click',stop,{capture:true}),350)}
document.addEventListener('pointerup',swFin,true);document.addEventListener('pointercancel',swFin,true);

    <label class="tg"><input type="checkbox" id="dPayC" ${d.payant?'checked':''}> Devis payant</label><div id="payW" ${d.payant?'':'hidden'}><label>Montant TTC (€)</label><input id="dPay" inputmode="decimal" value="${E(d.payantMontant)}"></div></div>
   <div class="card"><h3>Signature</h3>${segHTML('sign',[['lien','Lien'],['chez','Chez le client'],['locaux','Mes locaux']],d.signature)}</div>
  </fieldset>${lock?'':`<button class="btn sec" id="eDel" style="color:var(--ko)">${ico('trash')}</button>`}</div></div>
  <div class="dock"><div class="tt"><small>${mod?'Total':'Total TTC'}</small><b id="dkT"></b></div>${mod?'':'<button class="bdg" id="dkC"></button>'}<button class="btn" id="dkS" ${lock?'disabled':''} aria-label="${mod?'Enregistrer':'Envoyer'}">${ico(mod?'check':'send')}</button></div>`;
  eLines();eHead();bindEditor(d);
}
function eHead(){const d=getD(S.cur);if(!d)return;$('#eT').textContent=(d.statut==='modele'?d.nom:d.client.nom)||'—';$('#dkT').textContent=eur(totaux(d).ttc);
  const b=$('#dkC');if(!b)return;const c=controle(d),k=c.filter(x=>x.lvl==='ko').length,w=c.length-k;b.className='bdg '+(k?'ko':w?'warn':'ok');b.innerHTML=(k||w)?ico('alert','sm')+(k||w):ico('check','sm')}
function eLines(){const d=getD(S.cur),box=$('#eL');if(!d||!box)return;
  const dl=Object.values(S.prix).length?'':'';
  box.innerHTML=d.lignes.map((l,i)=>{if(l.sec!==undefined)return `<div class="ln lsec" data-i="${i}"><div class="row" style="align-items:center"><input data-f="sec" placeholder="Section" value="${E(l.sec)}" aria-label="Section"><button class="ib ko" data-t="del" style="width:36px;height:36px;flex:none" aria-label="Supprimer">${ico('trash','sm')}</button></div></div>`;
   const inc=incomplete(l,d);
   return `<div class="ln ${inc&&has(l.des)?'inc':''} ${l.opt?'lopt':''}" data-i="${i}"><input data-f="des" list="dlDes" placeholder="Désignation" value="${E(l.des)}" aria-label="Désignation">
   <div class="q"><div><label>Qté</label><input data-f="qte" inputmode="decimal" value="${E(l.qte)}"></div><div><label>Unité</label><input data-f="unite" value="${E(l.unite)}"></div><div><label>PU HT</label><input data-f="pu" inputmode="decimal" value="${E(l.pu)}"></div><div><label>TVA</label><select data-f="tva">${[20,10,5.5,0].map(t=>`<option value="${t}" ${num(l.tva)===t?'selected':''}>${fq(t)} %</option>`).join('')}</select></div></div>
   <div class="ft"><button class="tgl ${l.fourni?'on':''}" data-t="fourni">Fourni</button><button class="tgl ${l.opt?'on':''}" data-t="opt">Option</button><button class="tgl ${l.verif?'on':''}" data-t="verif">À vérifier</button><button class="ib ko" data-t="del" style="width:36px;height:36px" aria-label="Supprimer">${ico('trash','sm')}</button><span class="tl">${eur(ligneHT(l))}</span></div>
   ${l.fourni?`<input data-f="ref" placeholder="Marque, référence" value="${E(l.ref)}" style="margin-top:8px">`:''}</div>`}).join('')+`<datalist id="dlDes">${Object.keys(S.prix).map(k=>`<option value="${E(k)}">`).join('')}</datalist>`;
}
function bindEditor(d0){
  const ed=$('#ed'),d=()=>getD(S.cur),sv=()=>{saveD();eHead()};
  $('#eBack').onclick=fermerEditeur;
  $('#ePv').onclick=ouvrirApercu;
  if($('#dkC'))$('#dkC').onclick=()=>feuilleControle();
  $('#dkS').onclick=d0.statut==='modele'?()=>{toast('✓');fermerEditeur()}:envoyer;
  const on=(id,ev,f)=>{const el=$('#'+id);if(el)el['on'+ev]=f};
  on('mNom','input',e=>{d().nom=e.target.value;sv()});
  on('aNum','input',e=>{d().avenant.num=e.target.value;sv()});
  on('aDate','input',e=>{d().avenant.date=e.target.value;sv()});
  on('dAl','change',e=>{d().autoliq=e.target.checked;sv();eLines()});
  on('addS','click',()=>{d().lignes.push({id:uid(),sec:''});sv();eLines();const li=$$('#eL .ln');li[li.length-1].querySelector('input').focus()});
  const del=$('#eDel');if(del)del.onclick=()=>{if(confirm(trS('Supprimer ?'))){S.devis=S.devis.filter(x=>x.id!==S.cur);S.mesModeles=S.mesModeles.filter(x=>x.id!==S.cur);saveD();fermerEditeur()}};
  const setC=(f,v)=>{d().client[f]=v;sv()};
  if($('#cNom'))$('#cNom').oninput=async e=>{setC('nom',e.target.value);const q=e.target.value.trim();const box=$('#cSug');if(q.length<2){box.innerHTML='';return}
    const cs=(await lireClients()).map(c=>({c,s:sim(q,c.nom)})).filter(x=>x.s>=.6&&norm(x.c.nom)!==norm(q)).sort((a,b)=>b.s-a.s).slice(0,4);
    box.innerHTML=cs.length?'<div class="sugl">'+cs.map(x=>`<button data-c="${x.c.id}">${E(x.c.nom)}</button>`).join('')+'</div>':'';
    $$('#cSug button').forEach(b=>b.onclick=async()=>{const c=(await lireClients()).find(z=>z.id===b.dataset.c);if(!c)return;Object.assign(d().client,{id:c.id,nom:c.nom,adr:c.adr||'',chantier:c.chantier||'',type:c.type||'part'});sv();$('#cNom').value=c.nom;$('#cAdr').value=c.adr||'';$('#cChan').value=c.chantier||'';$('#cChan').placeholder=c.adr||'';box.innerHTML='';$$('[data-seg=ctype] button').forEach(x=>x.classList.toggle('on',x.dataset.v===(c.type||'part')))})};
  if($('#cChan'))$('#cChan').oninput=e=>setC('chantier',e.target.value);
  if($('#cAdr'))$('#cAdr').oninput=e=>{setC('adr',e.target.value);$('#cChan').placeholder=e.target.value};
  if($('#dDeb'))$('#dDeb').oninput=e=>{d().debut=e.target.value;sv()};
  if($('#dDur'))$('#dDur').oninput=e=>{d().duree=e.target.value;sv()};
  if($('#dVal'))$('#dVal').oninput=e=>{d().validiteJ=e.target.value;sv()};
  $('#dPct').oninput=e=>{d().acomptePct=e.target.value;sv()};
  $('#dPayC').onchange=e=>{d().payant=e.target.checked;$('#payW').hidden=!e.target.checked;sv()};
  $('#dPay').oninput=e=>{d().payantMontant=e.target.value;sv()};
  $('#add').onclick=()=>{const dd=d(),cat=CAT(dd.categorie);dd.lignes.push(ligneDepuis(L('',''),cat));sv();eLines();const li=$$('#eL .ln');li[li.length-1].querySelector('input').focus()};
  ed.onclick=e=>{
    const sg=e.target.closest('[data-seg] button');
    if(sg){const f=sg.parentElement.dataset.seg,v=sg.dataset.v;$$('button',sg.parentElement).forEach(b=>b.classList.toggle('on',b===sg));
      if(f==='ctype'){d().client.type=v;$('#alW').hidden=v!=='pro';if(v!=='pro'&&d().autoliq){d().autoliq=false;$('#dAl').checked=false}}if(f==='prix')d().prix=v;if(f==='acc'){d().acompteType=v;$('#pctW').hidden=v==='Aucun'}if(f==='sign')d().signature=v;sv();return}
    const ln=e.target.closest('.ln');if(!ln)return;const i=+ln.dataset.i,l=d().lignes[i],t=e.target.closest('[data-t]');if(!t)return;
    if(t.dataset.t==='del'){d().lignes.splice(i,1);sv();eLines()}
    else{l[t.dataset.t]=!l[t.dataset.t];sv();eLines()}};
  const onLn=e=>{const ln=e.target.closest('.ln');if(!ln||!e.target.dataset.f)return;const i=+ln.dataset.i,l=d().lignes[i],f=e.target.dataset.f;
    l[f]=f==='tva'?num(e.target.value):e.target.value;
    if(f==='des'){const m=prixMem(e.target.value);if(m!==undefined&&!has(l.pu)){l.pu=m;ln.querySelector('[data-f=pu]').value=m}}
    if(f==='pu'&&has(l.des)&&num(l.pu)>0){S.prix[norm(l.des)]=l.pu;savePrix()}
    const tl=ln.querySelector('.ft .tl');if(tl)tl.textContent=eur(ligneHT(l));if(!l.sec&&l.sec!==''){ln.classList.toggle('inc',has(l.des)&&incomplete(l,d()))}sv()};
  ed.oninput=onLn;ed.onchange=onLn;
}
function fermerEditeur(){const d=getD(S.cur);if(d&&d.statut!=='modele')upsertClient(d.client);if(d)saveD();$('#ed').hidden=true;$('#ed').innerHTML='';document.body.classList.remove('lock');S.cur=null;refresh()}
function sheet(html){const bg=document.createElement('div');bg.className='sh-bg';const s=document.createElement('div');s.className='sh';s.innerHTML='<div class="gr"></div>'+html;const close=()=>{bg.remove();s.remove()};bg.onclick=close;document.body.append(bg,s);paintIcons(s);return{el:s,close}}
function feuilleControle(after){const d=getD(S.cur);const c=controle(d);
  const h=c.length?c.map((x,i)=>`<button class="iss ${x.lvl}" data-i="${i}"><span class="d"></span><span>${E(x.txt)}</span></button>`).join(''):`<div class="empty">${ico('check')}</div>`;
  const sh=sheet(h+(after&&c.length&&!c.some(x=>x.lvl==='ko')?`<button class="btn" id="goAnyway" style="margin-top:12px">${ico('send')}</button>`:''));
  $$('.iss',sh.el).forEach(b=>b.onclick=()=>{const x=c[+b.dataset.i];sh.close();aller(x.go)});
  const ga=$('#goAnyway',sh.el);if(ga)ga.onclick=()=>{sh.close();after()};
}
function aller(g){if(!g)return;if(g.p&&S.sansEnt){fermerEditeur();emit('entreprise',{champ:g.p});if(hooks.ouvrirEntreprise)try{hooks.ouvrirEntreprise(g.p)}catch(e){}return}if(g.p){fermerEditeur();go('prof');const el=$('[data-p='+g.p+']');if(el){el.scrollIntoView({block:'center'});el.focus();el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),2500)}return}
  if(g.l!==undefined){const ln=$$('#eL .ln')[g.l];if(ln){ln.scrollIntoView({block:'center'});const i=[...ln.querySelectorAll('input')].find(x=>!has(x.value));(i||ln.querySelector('input')).focus()}return}
  if(g.f){const el=$('#'+g.f);if(el){el.scrollIntoView({block:'center'});if(el.focus)el.focus()}}}
function envoyer(){const d=getD(S.cur);if(!d)return;const c=controle(d);
  if(c.some(x=>x.lvl==='ko'))return feuilleControle();
  const fin=()=>{upsertClient(d.client);d.statut='envoye';d.envoye=today();d.snapshot=renderDoc(d);saveD();emit('envoi',{devis:clone(d),html:d.snapshot,controle:c});if(hooks.sendDevis)try{hooks.sendDevis(clone(d),d.snapshot)}catch(e){}toast('✓');fermerEditeur()};
  if(c.length)return feuilleControle(fin);
  fin();
}
function ouvrirApercu(){const d=getD(S.cur);if(!d)return;const pv=$('#pv');pv.hidden=false;
  const draw=()=>{const dd=getD(S.cur);pv.querySelector('.pg').innerHTML=dd.statut!=='brouillon'&&dd.snapshot?dd.snapshot:renderDoc(dd)};
  pv.innerHTML=`<div class="bar"><button class="ib" id="pBack" aria-label="Retour">${ico('back')}</button><div class="seg" style="flex:1" id="pSeg">${STYLES.concat(persos()).map(l=>`<button data-l="${l.id}" class="${styleDe(d)===l.id?'on':''}">${E(l.nom)}</button>`).join('')}</div></div><div class="stage"><div class="pg"></div></div>`;
  draw();$('#pBack').onclick=()=>{pv.hidden=true;pv.innerHTML=''};
  $$('#pSeg button').forEach(b=>b.onclick=()=>{getD(S.cur).layout=b.dataset.l;saveD();$$('#pSeg button').forEach(x=>x.classList.toggle('on',x===b));draw()});
}

function refresh(){
  if(S.tab==='list')rList();if(S.tab==='mod')rMod();if(S.tab==='prof')rProf();
  paintIcons();
  if(!$('#ed').hidden&&S.cur&&getD(S.cur))eHead();
  if(!$('#pv').hidden&&S.cur&&getD(S.cur)){const dd=getD(S.cur);$('#pv .pg').innerHTML=dd.statut!=='brouillon'&&dd.snapshot?dd.snapshot:renderDoc(dd)}
}
$('#hdLogo').onclick=()=>{emit('accueil',{});if(hooks.accueil)try{hooks.accueil()}catch(e){}};
paintIcons();cmpIco();rList();rMod();rProf();
if(/[?&#]embed/.test(location.href))api.integrer({barre:false});
if(location.hash==='#demo')donneesEssai();
})();
</script>
</body>
</html>
