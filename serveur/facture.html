<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Facture</title>
<style>
:root{--bg:#f2f2ef;--card:#fbfbfa;--ink:#18181a;--mut:#6b6b70;--line:#e2e1dc;--acc:#ffc21a;--ok:#1e7a46;--ko:#b42318;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1b1b1e;--ink:#f1f1ee;--mut:#a3a3a8;--line:#2e2e33;--ok:#4cc38a;--ko:#ff7a6b;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h1{font-size:24px;line-height:1.2;margin:0}
h2{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.mut{color:var(--mut)}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.num{font-family:var(--mono);font-size:13px;color:var(--mut)}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln small{color:var(--mut);grid-column:1}
.ln b{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--mono);font-weight:600}
.tot{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.tot b{font-family:var(--mono)}
.big{font-size:20px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.st{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;font-weight:700}
.st.paid{background:color-mix(in srgb,var(--ok) 15%,var(--card));border:1px solid var(--ok);color:var(--ok)}
.st.due{background:color-mix(in srgb,var(--acc) 22%,var(--card));border:1px solid var(--acc)}
.st.late{background:color-mix(in srgb,var(--ko) 12%,var(--card));border:1px solid var(--ko);color:var(--ko)}
.st svg{width:28px;height:28px;flex:none}
button{font:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--acc);color:#18181a;font-weight:800;font-size:17px;cursor:pointer;margin-top:10px}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.iban{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:15px;word-break:break-all}
input[type=text]{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit;margin:6px 0}
label.ck{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
label.ck input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:#e0a800}
.cert{font-size:14px;line-height:1.45}
.err{color:var(--ko);font-weight:600;margin:6px 0 0}
.legal{font-size:12.5px;line-height:1.45}
.stamp{display:none}
#load{padding:40px 0;text-align:center}
@media print{
 body{background:#fff;color:#000;padding:0;font-size:12px}
 .card{border:0;padding:6px 0;background:#fff}
 .noprint,.st{display:none!important}
 .stamp{display:block;border:3px solid #1e7a46;color:#1e7a46;font-weight:800;font-size:18px;padding:6px 12px;border-radius:8px;transform:rotate(-4deg);width:max-content;margin:6px 0}
 body.unpaid main{display:none}
 body.unpaid::after{content:"La facture PDF est disponible après le paiement.";display:block;padding:40px;font-size:18px}
}
</style>
</head>
<body class="unpaid">
<main id="m"><div id="load" class="mut">Chargement de la facture…</div></main>
<script>
const $=id=>document.getElementById(id),tok=location.pathname.split('/').pop();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(+n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
/* factfix-v1 */const D=s=>{if(!s)return'';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);const d=m?new Date(+m[1],m[2]-1,+m[3]):new Date(s);return isNaN(d)?'':d.toLocaleDateString('fr-FR')};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const N=v=>Number.isFinite(+v)?String(+v).replace('.',','):'';
const fmtN=n=>(+n||0).toLocaleString('fr-FR',{maximumFractionDigits:2});
const ICON={ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m7 12.5 3 3 7-7"/></svg>',due:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
 dl:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>'};
let S=null;
async function load(){
 try{const r=await fetch('/api/f/'+tok,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');S=j;render()}
 catch(e){$('m').innerHTML=`<div class="card"><h1>Facture introuvable</h1><p class="mut">${esc(e.message)}</p></div>`}}
function render(){
 const f=S.doc,c=f.calc||{},P=f.seller||{},paid=c.state==='payee',avoir=f.kind==='avoir',late=!paid&&!avoir&&c.state!=='annulee'&&f.due&&f.due<today(),gone=c.state==='annulee';
 document.body.classList.toggle('unpaid',!(paid||avoir));
 document.title=(avoir?'Avoir ':'Facture ')+f.num;
 const ttl=avoir?'Avoir':f.kind==='acompte'?"Facture d'acompte":'Facture';
 const ent=(P.nom||'')+(P.forme&&/^(EI|micro)/i.test(P.forme)&&!/\b(EI|entrepreneur individuel)\b/i.test(P.nom||'')?' EI':'');
 let h=`<div class="card"><div class="top"><div><div class="num">${esc(ttl)} ${esc(f.num)}</div><h1>${esc(ent)}</h1><div class="mut">${esc(P.adr)}</div></div>
  <div style="text-align:right"><div class="mut">Date : ${D(f.date)}</div>${f.qnum?`<div class="mut">Devis n° ${esc(f.qnum)}</div>`:''}${f.done?`<div class="mut">${f.kind==='acompte'?'Début des travaux':'Travaux réalisés le'} : ${D(f.done)}</div>`:''}</div></div>
  ${paid?`<div class="stamp">ACQUITTÉE le ${D(c.paidAt)}</div>`:''}</div>`;
 if(!avoir&&gone)h+=`<div class="st paid noprint">${ICON.ok}<div>Cette facture a été annulée par avoir : il n'y a rien à régler.</div></div>`;
 else if(!avoir)h+=paid?`<div class="st paid noprint">${ICON.ok}<div>Facture réglée le ${D(c.paidAt)}. Merci !</div></div>`
  :`<div class="st ${late?'late':'due'} noprint">${ICON.due}<div>${late?'Échéance dépassée':'À régler'} : <b>${eur(c.due)}</b>${f.due?` · ${f.due===f.date?'à réception':'avant le '+D(f.due)}`:''}</div></div>`;
 h+=`<div class="card"><h2>Client</h2><b>${esc(f.client.nom)}</b><div class="mut">${esc(f.client.adr)}${f.client.pro&&f.client.siren?'<br>SIREN : '+esc(f.client.siren):''}${f.client.tvai?'<br>N° TVA : '+esc(f.client.tvai):''}</div>${f.chantier&&f.chantier!==f.client.adr?`<div class="mut">Chantier : ${esc(f.chantier)}</div>`:''}</div>`;
 h+=`<div class="card"><h2>Détail</h2>`+f.lines.map(l=>`<div class="ln"><span>${esc(l.label)}</span><small>${fmtN(l.qty)} ${esc(l.unit)} × ${eur(l.pu)}${f.franchise||f.autoliq?'':' · TVA '+N(l.tva)+' %'}</small><b>${eur(Math.round(l.qty*l.pu*100)/100)}</b></div>`).join('')+
  `<div style="margin-top:10px">${f.remise?`<div class="tot"><span>Remise</span><b>${N(f.remise)} %</b></div>`:''}<div class="tot"><span>Total HT</span><b>${eur(c.ht)}</b></div>`+
  (f.franchise?`<div class="mut">TVA non applicable, art. 293 B du CGI</div>`:f.autoliq?`<div class="mut">Autoliquidation : TVA due par le preneur, art. 283-2 nonies du CGI</div>`:Object.keys(c.tv||{}).map(k=>`<div class="tot"><span>TVA ${N(k)} %</span><b>${eur(c.tv[k])}</b></div>`).join(''))+
  `<div class="tot big"><span>Total TTC</span><b>${eur(c.ttc)}</b></div>`+(f.ded||[]).map(d=>`<div class="tot"><span>Acompte facturé n° ${esc(d.num)}</span><b>− ${eur(d.ttc)}</b></div>`).join('')+
  (c.ret?`<div class="tot"><span>Retenue de garantie ${N(f.ret)} %</span><b>− ${eur(c.ret)}</b></div>`:'')+((c.ded||c.ret)?`<div class="tot big"><span>Net à payer</span><b>${eur(c.net)}</b></div>`:'')+
  ((c.avoirs||[]).length?(c.avoirs.map(a=>`<div class="tot"><span>Avoir n° ${esc(a.num)}</span><b>− ${eur(a.amt)}</b></div>`).join('')):'')+
  (c.paid&&!avoir?`<div class="tot"><span>Déjà réglé</span><b>${eur(c.paid)}</b></div>`:'')+`</div></div>`;
 if(!avoir&&!paid&&!gone&&P.iban)h+=`<div class="card noprint"><h2>Paiement par virement</h2><div class="iban"><span id="iban">${esc(P.iban)}</span></div>${P.bic?`<div class="mut">BIC : ${esc(P.bic)}</div>`:''}<div class="mut">Référence : ${esc(f.num)}</div><button class="btn sec" onclick="copyIban()">Copier l'IBAN</button></div>`;
 if(f.red&&!avoir){
  const txt=`certifie, en qualité de preneur de la prestation, que les travaux réalisés concernent des locaux à usage d'habitation achevés depuis plus de deux ans et qu'ils n'ont pas eu pour effet, sur une période de deux ans au plus, de concourir à la production d'un immeuble neuf ni d'entraîner une augmentation de la surface de plancher des locaux existants supérieure à 10 %${f.red55?" et qu'ils ont la nature de travaux de rénovation énergétique":''}.`;
  h+=S.cert?`<div class="card cert"><h2>TVA à taux réduit</h2>Je soussigné(e) <b>${esc(S.cert.name)}</b> ${esc(txt)}<div class="mut">Certifié en ligne le ${new Date(S.cert.at).toLocaleString('fr-FR')}.</div></div>`
   :`<div class="card cert"><h2>TVA à taux réduit : à certifier</h2><p>Pour bénéficier de la TVA réduite, vous devez certifier ceci :</p><p>Je soussigné(e) <input type="text" id="cn" placeholder="Nom et prénom" autocomplete="name"> ${esc(txt)}</p>
    <label class="ck"><input type="checkbox" id="ca"><span>Je certifie l'exactitude de ces informations.</span></label><div id="ce" class="err" hidden></div><button class="btn" onclick="certify()">Certifier</button></div>`}
 if(!avoir)h+=`<div class="card legal mut">Échéance : ${f.due===f.date?'à réception':D(f.due)}. Pas d'escompte pour paiement anticipé. En cas de retard, pénalités au taux de ${esc(P.penal||"3 fois le taux d'intérêt légal")}${f.client.pro?', et indemnité forfaitaire pour frais de recouvrement de 40 € (art. L441-10 du Code de commerce)':''}.${P.assur?`<br>Assurance décennale : ${esc(P.assur)} — couverture : ${esc(P.zone||'France métropolitaine')}.`:''}<br>${esc(ent)} · SIRET ${esc(P.siret)}${P.rm?' · '+esc(P.rm):''}${P.tva&&!f.franchise?' · TVA '+esc(P.tva):''}${P.tel?' · '+esc(P.tel):''}${P.email?' · '+esc(P.email):''}</div>`;
 h+=(paid||avoir)?`<button class="btn noprint" onclick="window.print()">${ICON.dl}Télécharger la facture (PDF)</button>`:`<p class="mut noprint" style="text-align:center">La facture en PDF sera disponible ici dès que le paiement sera enregistré.</p>`;
 $('m').innerHTML=h}
function copyIban(){const t=$('iban').textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{event&&event.target&&(event.target.textContent='IBAN copié')},()=>{})}
async function certify(){
 const n=$('cn').value.trim(),a=$('ca').checked,e=$('ce');e.hidden=true;
 if(n.length<2){e.textContent='Écrivez votre nom.';e.hidden=false;return}if(!a){e.textContent='Cochez la case pour certifier.';e.hidden=false;return}
 try{const r=await fetch('/api/f/'+tok+'/certify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:n,agree:true})}),j=await r.json();if(!r.ok)throw new Error(j.error);S.cert=j.cert;render()}
 catch(x){e.textContent=x.message||'Erreur';e.hidden=false}}
load();
</script>
</body>
</html>
