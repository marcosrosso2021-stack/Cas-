<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121214">
<title>Veille casô</title>
<style>
/* Tableau de bord privé de la veille réglementaire : le propriétaire de casô y valide, corrige ou refuse chaque texte. Rien ne part sans lui. */
:root{--bg:#f4f4f1;--card:#fff;--soft:#f0f0ed;--ink:#18181a;--mut:#6b6b70;--line:#e4e3de;--acc:#ffc21a;--ok:#1e7a46;--warn:#9a6700;--ko:#b42318;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1b1b1e;--soft:#242428;--ink:#f1f1ee;--mut:#a3a3a8;--line:#2e2e33;--ok:#4cc38a;--warn:#e3b341;--ko:#ff7a6b;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:720px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
a{color:inherit}

.haut{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--acc);flex:none;display:block}
.haut h1{margin:0;font-size:20px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.haut p{margin:0;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}.haut p i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}.haut p i.ko{background:var(--ko)}
.rond{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.rond svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rond.tourne svg{animation:t 1s linear infinite}@keyframes t{to{transform:rotate(360deg)}}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:14px;padding:4px;margin:0 0 14px}
.modes button{border:0;background:none;border-radius:11px;min-height:40px;font-size:15px;color:var(--mut)}
.modes button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:700}
.bloc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 10px}
.bloc h2{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.chiffres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (min-width:560px){.chiffres{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chiffres b{display:block;font-size:24px;line-height:1.1;font-weight:800}.chiffres span{font-size:13px;color:var(--mut)}
.barres{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:16px}
.barres i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.barres i.zero{background:var(--line)}
.axe{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.ligne{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.ligne:first-of-type{border-top:0;padding-top:0}.ligne span:last-child{font-weight:700;white-space:nowrap}.ligne em{font-style:normal;color:var(--mut)}
.hero{position:relative;overflow:hidden;background:#18181a;color:#f4f4f1;border-radius:22px;padding:20px 20px 18px;margin:0 0 14px}
.hero::after{content:'';position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,194,26,.35),rgba(255,194,26,0));pointer-events:none}
.hero small{display:flex;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:#a3a3a8}
.hero small i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.hero .gros{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:8px 0 2px}.hero .gros b{font-size:46px;line-height:1;font-weight:800;letter-spacing:-.03em}
.hero .gros span{font-size:15px;color:#c9c9c4}.hero .gros .plus{color:var(--acc);font-weight:700}
.hero .bas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:18px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
.hero .bas button{border:0;background:none;text-align:left;padding:0;color:inherit;min-height:44px}.hero .bas b{display:block;font-size:20px;font-weight:800;line-height:1.2}.hero .bas span{font-size:12.5px;color:#a3a3a8}
.hero .bas .rouge b{color:#ff7a6b}
@media (prefers-color-scheme:dark){.hero{background:#1f1f23;border:1px solid var(--line)}}
.puces{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}.puces::-webkit-scrollbar{display:none}
.puce{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:38px;font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px}
.puce b{font-weight:700;color:var(--ink);opacity:.55}.puce[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}.puce[aria-pressed=true] b{color:inherit;opacity:.7}
.puces select{flex:0 0 auto;appearance:none;-webkit-appearance:none;border:1px dashed var(--line);background:none;border-radius:999px;padding:0 14px;min-height:38px;font-size:14px;color:var(--mut)}
.note{border-radius:14px;padding:11px 14px;font-size:14px;margin:0 0 14px;background:var(--soft)}
.note.ko{color:var(--ko)}
.carte{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 8px;overflow:hidden;transition:border-color .15s}
.carte::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.carte.P0::before{background:var(--ko)}.carte.P1::before{background:var(--acc)}
.carte.ouv{border-color:var(--ink)}
.tete{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px 14px 18px;align-items:start}
.tete h2{margin:0;font-size:15.5px;line-height:1.35;font-weight:650;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere}
.carte.ouv .tete h2{display:block}
.tete small{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--mut)}
.tete small .j{color:var(--ink);font-weight:600}.tete small .j.proche{color:var(--ko)}
.etat{font-size:12px;font-weight:600;border-radius:999px;padding:4px 9px;background:var(--soft);color:var(--mut);white-space:nowrap}
.etat.bl{background:color-mix(in srgb,var(--ko) 14%,transparent);color:var(--ko)}.etat.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.etat.att{background:var(--acc);color:#18181a}
.tag{font:600 11px/1 var(--mono);border-radius:6px;padding:4px 7px;background:var(--soft);color:var(--mut)}
.tag.P0{background:var(--ko);color:#fff}.tag.P1{background:var(--warn);color:#fff}
.tri{padding:16px 18px}.tri p{margin:0 0 4px;font-size:15px}.tri small{display:block;color:var(--mut);font-size:13px;margin-bottom:12px}.tri .oui{width:100%}
.corps{padding:4px 18px 18px}
.corps h3{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.resume{margin:6px 0 0;font-size:15px;line-height:1.5}
.faits{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px 12px;margin:0;font-size:14px}
.faits dt{color:var(--mut)}.faits dd{margin:0;overflow-wrap:anywhere}
.champ{display:block;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;margin-bottom:8px}
.choix{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px}
.choix input{width:22px;height:22px;accent-color:var(--acc);flex:none}
details{margin-top:10px}summary{font-size:14px;color:var(--mut);min-height:40px;display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
summary::after{content:'›';font-size:18px;line-height:1;transition:transform .15s}details[open] summary::after{transform:rotate(90deg)}
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grille label{font-size:12px;color:var(--mut)}.grille .large{grid-column:1/-1}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mods label{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;display:flex;gap:6px;align-items:center}
.mods input{accent-color:var(--acc)}
.actes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.oui{flex:1 1 150px;border:0;background:var(--acc);color:#18181a;border-radius:14px;min-height:48px;font-weight:700}
.non{flex:1 1 110px;border:1px solid var(--line);background:none;border-radius:14px;min-height:48px}
.vide{text-align:center;padding:40px 24px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:14.5px}
.vide::before{content:'✓';display:grid;place-items:center;width:44px;height:44px;margin:0 auto 12px;border-radius:50%;background:var(--soft);color:var(--ok);font-weight:800}
.vide b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.vide .oui{margin-top:16px;padding:0 22px;flex:none}
.porte{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:8px}
.porte label{display:block;font-size:14px;color:var(--mut);margin-bottom:8px}
.porte .oui{width:100%;margin-top:10px}
.module h2{margin:0 0 4px;font-size:16px;text-transform:capitalize}
.module p{margin:10px 0 2px;font-size:15px}.module div{font-size:14px;color:var(--mut)}

/* nouveau format : police Inter, fond chaud, cartes blanches (comme l'appli) */
@font-face{font-family:Inter;font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/inter-400.woff) format("woff")}@font-face{font-family:Inter;font-weight:500;font-style:normal;font-display:swap;src:url(/fonts/inter-500.woff) format("woff")}@font-face{font-family:Inter;font-weight:600;font-style:normal;font-display:swap;src:url(/fonts/inter-600.woff) format("woff")}@font-face{font-family:Inter;font-weight:700;font-style:normal;font-display:swap;src:url(/fonts/inter-700.woff) format("woff")}
:root{--mono:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:light){:root{--bg:#f4f3ef;--card:#fff;--soft:#f4f3ef;--ink:#141414;--mut:#5e5e5a;--line:#e4e2dc}}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font-family:inherit}
.card{border-radius:20px}.btn{border-radius:999px}
</style>
</head>
<body>
<main>
<header class="haut">
 <img class="logo" src="/icon-192.png" alt="casô" width="36" height="36">
 <div><h1 id="titre">Veille</h1><p id="sync"></p></div>
 <button class="rond" id="collecte" aria-label="Lancer une collecte" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</header>
<section class="porte" id="porte" hidden><label for="cle">Clé du propriétaire</label><input class="champ" id="cle" type="password" autocomplete="off"><button class="oui" id="entrer">Entrer</button></section>
<nav class="modes" id="modes" hidden><button type="button" data-m="veille" aria-pressed="true">Veille</button><button type="button" data-m="saas" aria-pressed="false">casô</button></nav>
<div id="saas" hidden></div>
<div id="app" hidden>
 <section class="hero" id="hero"></section>
 <nav class="puces" id="onglets" aria-label="Filtrer"></nav>
</div>
<div class="note" id="msg" role="status" hidden></div>
<div id="liste"></div>
</main>
<script>
'use strict';
(function(){
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const CAT={nouveaute:'Nouveauté du métier',confirme:'Changement confirmé',echeance:'Échéance à venir',clarification:'Clarification',proposition:'Proposition',non_confirme:'Non confirmé',aucun:'Aucun changement'};
const DOM={fiscalite:'Fiscalité',facturation:'Facturation',assurance:'Assurance',construction:'Construction',renovation:'Rénovation',urbanisme:'Urbanisme',numerique:'Numérique',donnees:'Protection des données'};
const SRC={bofip:'BOFiP',entreprendre:'Entreprendre',legifrance:'Légifrance',particuliers:'Service-Public',viepublique:'Vie publique',ecologie:'Écologie',cnil:'CNIL',capeb:'CAPEB',batiactu:'Batiactu',economie:'Économie',travail:'Travail',re2020:'RE2020',batimentartisanal:'Bâtiment Artisanal',batijournal:'Batijournal',anah:'Anah',inrs:'INRS',oppbtp:'OPPBTP',qualibat:'Qualibat',ffb:'FFB',batiweb:'Batiweb',impots:'Impôts',zepros:'Zepros'};
const TRI={envoyer:'À envoyer',garder:'À garder',ecarter:'À écarter'};
const ONGLETS=[['decider','À décider'],['enligne','En ligne'],['critiques','Critiques'],['echeances','Échéances'],['adapter','À adapter'],['garde','Gardés'],['refuse','Refusés']];
const VIDE={decider:['Rien à décider','Le tri se fait tout seul. Ici n\'arrive que ce qui a besoin de toi.'],enligne:['Rien en ligne','La newsletter se remplit à la prochaine collecte.'],garde:['Rien de gardé',''],critiques:['Aucun texte critique','Rien n\'entre en vigueur dans les 30 jours.'],
 echeances:['Aucune échéance à venir',''],adapter:['Rien à adapter','Aucun texte validé ne touche un module de casô.'],refuse:['Aucun texte refusé','']};
let cle='',T=[],E={modules:[],domaines:[]},vue='',dom='',ouvert=decodeURIComponent(location.hash.slice(1)),occupe=false,mode=ouvert==='saas'?'saas':'veille',S=null;
try{cle=sessionStorage.getItem('caso-veille')||''}catch(e){}
async function api(chemin,corps){const r=await fetch('/api/veille/'+chemin,{method:corps?'POST':'GET',headers:Object.assign({'x-caso-cle':cle},corps?{'content-type':'application/json'}:{}),body:corps?JSON.stringify(corps):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===404?'Clé refusée.':j.error||'Erreur '+r.status);return j}
function dire(m,ko){const e=$('msg');e.textContent=m||'';e.hidden=!m;e.className='note'+(ko?' ko':'')}
const fr=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'—';
const dans=f=>f.delaiJours>0?' · dans '+f.delaiJours+' j':f.dateVigueur?' · en vigueur':'';
async function charger(){
 try{E=await api('etat');T=await api('textes');if(mode==='saas')S=await api('saas')}catch(e){$('porte').hidden=false;['app','saas','modes','collecte'].forEach(i=>$(i).hidden=true);$('liste').textContent='';$('sync').textContent='';return dire(cle?e.message:'',true)}
 try{sessionStorage.setItem('caso-veille',cle)}catch(e){}
 $('porte').hidden=true;$('modes').hidden=false;const v=mode==='veille';$('app').hidden=!v;$('liste').hidden=!v;$('collecte').hidden=!v;$('saas').hidden=v;$('titre').textContent=v?'Veille':'casô';
 Array.prototype.forEach.call($('modes').children,b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
 if(v)dessiner();else tableau()}
/* le tableau de bord de casô : des nombres seulement, lus sur le serveur */
const OFFRES={artisan_pro:'Artisan pro',artisan:'Artisan',artisan_curieux:'Artisan curieux (essai)',artisan_fin_essai:'Essai terminé',bricoleur_pro:'Bricoleur du dimanche pro',bricoleur:'Bricoleur du dimanche',sans_choix:'Sans mode choisi'};
function tableau(){
 const z=$('saas'),c=S.comptes;z.textContent='';$('sync').textContent='Serveur démarré le '+fr(S.serveur.demarre.slice(0,10))+' · '+S.serveur.memoireMo+' Mo';
 const bloc=(t)=>{const b=el('section','bloc');b.append(el('h2',null,t));z.append(b);return b},nb=(b,L)=>{const g=el('div','chiffres');L.forEach(([n,l])=>{const d=el('div');d.append(el('b',null,n),el('span',null,l));g.append(d)});b.append(g)};
 const li=(b,l,v,sous)=>{const r=el('div','ligne'),g=el('span',null,l);if(sous){g.append(document.createTextNode(' '),el('em',null,sous))}r.append(g,el('span',null,v));b.append(r)};
 const a=bloc('Comptes');nb(a,[[c.total,'Comptes'],[c.actifs7,'Actifs sur 7 jours'],[c.nouveaux7,'Nouveaux sur 7 jours'],[c.essaisFin7,'Essais qui finissent sous 7 jours']]);
 const max=Math.max(1,...c.parJour.map(x=>x.n)),ba=el('div','barres');ba.setAttribute('role','img');ba.setAttribute('aria-label','Nouveaux comptes par jour, 14 derniers jours');
 c.parJour.forEach(x=>{const i=el('i',x.n?null:'zero');i.style.height=Math.round(x.n/max*100)+'%';i.title=fr(x.j)+' : '+x.n;ba.append(i)});
 const ax=el('div','axe');ax.append(el('span',null,fr(c.parJour[0].j).slice(0,5)),el('span',null,'Nouveaux comptes, 14 jours'),el('span',null,fr(c.parJour[c.parJour.length-1].j).slice(0,5)));a.append(ba,ax);
 const o=bloc('Offres');const ko=Object.keys(c.offres).sort((x,y)=>c.offres[y]-c.offres[x]);if(!ko.length)li(o,'Aucun compte pour l\'instant','');ko.forEach(k=>li(o,OFFRES[k]||k,c.offres[k]));
 li(o,'Connexion Google',c.google);li(o,'Connexion Microsoft',c.microsoft);
 const u=bloc('Usage');li(u,'Devis envoyés à signer','' +S.signatures.envoyees7,'7 jours');li(u,'En attente de signature',S.signatures.enAttente);li(u,'Devis signés',S.signatures.signees);
 li(u,'Téléphones avec notifications',S.notifications);li(u,'Comptes d\'équipe',S.equipes);li(u,'Recherches de prix',S.prix.pret?S.prix.jour+' / '+S.prix.limite:'Non activées','aujourd\'hui');
 const h=bloc('Chat');li(h,'Phrases apprises et partagées',S.chat.apprises);if(!S.chat.incomprises.length)li(h,'Phrases non comprises par 3 usagers ou plus',0);
 S.chat.incomprises.forEach(x=>li(h,'« '+x.t+' »',x.n,x.l));
 const w=bloc('Veille');li(w,'Dernière collecte',S.veille.dernierPassage?fr(S.veille.dernierPassage.slice(0,10)):'Aucune');li(w,'Textes à valider',S.veille.aValider);li(w,'Textes à vérifier',S.veille.aVerifier);
 li(w,'Sources suivies',(S.veille.sources||[]).length);if(S.veille.erreursDernier)li(w,'Sources en erreur à la dernière collecte',S.veille.erreursDernier)}
const vivant=f=>f.validation!=='refuse';
const auj=()=>new Date().toISOString().slice(0,10),enLigne=f=>f.validation==='valide'&&f.lettre===true&&!!f.publieLe&&f.publieLe<=auj();
const VUES={decider:f=>f.validation==='attente',enligne:enLigne,garde:f=>f.validation==='valide'&&!enLigne(f),critiques:f=>vivant(f)&&f.priorite==='P0',echeances:f=>vivant(f)&&f.delaiJours>0,adapter:f=>f.validation==='valide'&&(f.modules||[]).length>0,refuse:f=>f.validation==='refuse'};
const choisis=()=>T.filter(f=>VUES[vue](f)&&(!dom||(f.domaines||[]).includes(dom)));
function bouton(c,k,cur,contenu){const b=el('button',c);b.type='button';b.setAttribute('aria-pressed',String(cur===k));contenu(b);b.onclick=()=>{vue=k;ouvert='';dessiner()};return b}
const heure=d=>{const x=new Date(d);return isNaN(x)?'':fr(d.slice(0,10)).slice(0,5)+' à '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')};
function dessiner(){
 const n=k=>T.filter(VUES[k]).length;if(!vue)vue=n('decider')?'decider':'enligne';
 const ko=E.erreursDernier>0,sy=$('sync');sy.textContent='';
 sy.append(el('i',ko?'ko':null),document.createTextNode(E.dernierPassage?(ko?E.erreursDernier+' source'+(E.erreursDernier>1?'s':'')+' en panne':'À jour')+' · '+heure(E.dernierPassage):'Aucune collecte pour l\'instant'));
 /* l'essentiel d'un coup d'œil : ce que voient les artisans, et ce qui attend */
 const h=$('hero');h.textContent='';const L0=T.filter(enLigne),neuf=L0.filter(f=>f.publieLe===auj()).length;
