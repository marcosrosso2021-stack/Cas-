<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121214">
<title>Veille casô</title>
<style>
/* Tableau de bord privé de la veille réglementaire : le propriétaire de casô y valide, corrige ou refuse chaque texte. Rien ne part sans lui. */
:root{--bg:#f4f4f1;--card:#fff;--soft:#f0f0ed;--ink:#18181a;--mut:#6b6b70;--line:#e4e3de;--acc:#ffc21a;--ok:#1e7a46;--warn:#9a6700;--ko:#b42318;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1b1b1e;--soft:#242428;--ink:#f1f1ee;--mut:#a3a3a8;--line:#2e2e33;--ok:#4cc38a;--warn:#e3b341;--ko:#ff7a6b;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:720px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
a{color:inherit}

.haut{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--acc);flex:none;display:block}
.haut h1{margin:0;font-size:20px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.haut p{margin:0;font-size:13px;color:var(--mut)}
.rond{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.rond svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rond.tourne svg{animation:t 1s linear infinite}@keyframes t{to{transform:rotate(360deg)}}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:14px;padding:4px;margin:0 0 14px}
.modes button{border:0;background:none;border-radius:11px;min-height:40px;font-size:15px;color:var(--mut)}
.modes button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:700}
.bloc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 10px}
.bloc h2{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.chiffres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (min-width:560px){.chiffres{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chiffres b{display:block;font-size:24px;line-height:1.1;font-weight:800}.chiffres span{font-size:13px;color:var(--mut)}
.barres{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:16px}
.barres i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.barres i.zero{background:var(--line)}
.axe{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.ligne{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.ligne:first-of-type{border-top:0;padding-top:0}.ligne span:last-child{font-weight:700;white-space:nowrap}.ligne em{font-style:normal;color:var(--mut)}
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 14px}
@media (min-width:560px){.tuiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tuile{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;min-height:76px}
.tuile b{display:block;font-size:26px;line-height:1.1;font-weight:800}
.tuile span{font-size:13px;color:var(--mut)}
.tuile[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tuile[aria-pressed=true] span{color:inherit;opacity:.75}
.tuile.alerte b{color:var(--ko)}.tuile.alerte[aria-pressed=true] b{color:inherit}

.barre{display:flex;align-items:center;gap:4px;margin:0 0 14px;flex-wrap:wrap}
.onglet{border:0;background:none;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--mut);min-height:40px}
.onglet[aria-pressed=true]{color:var(--ink);background:var(--soft);font-weight:600}
@media (max-width:559px){.barre select{flex:1 1 100%;max-width:none!important;margin-left:0!important}}
.barre select{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px;min-height:40px;max-width:52%}

.note{border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 14px;background:var(--soft)}
.note.ko{color:var(--ko)}

.carte{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 10px;overflow:hidden}
.tete{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 16px}
.etiq{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font:600 11px/1 var(--mono);border-radius:6px;padding:4px 7px;background:var(--soft);color:var(--mut)}
.tri{padding:16px}.tri p{margin:0 0 4px;font-size:15px}.tri small{display:block;color:var(--mut);font-size:13px;margin-bottom:12px}.tri .oui{width:100%}
.tag.tri-envoyer{background:var(--acc);color:#18181a}.tag.tri-ecarter{text-decoration:line-through}
.tag.P0{background:var(--ko);color:#fff}.tag.P1{background:var(--warn);color:#fff}.tag.bl{color:var(--ko)}.tag.env{color:var(--ok)}
.tete h2{margin:0;font-size:16px;line-height:1.35;font-weight:600}
.tete small{display:block;margin-top:4px;font-size:13px;color:var(--mut)}
.corps{padding:0 16px 16px;border-top:1px solid var(--line)}
.corps h3{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.resume{margin:14px 0 0;font-size:15px}
.faits{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
.faits dt{color:var(--mut)}.faits dd{margin:0;overflow-wrap:anywhere}
.champ{display:block;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
.choix{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;min-height:44px}
.choix input{width:22px;height:22px;accent-color:var(--acc);flex:none}
details{margin-top:14px}summary{font-size:14px;color:var(--mut);min-height:40px;display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
summary::after{content:'›';font-size:18px;line-height:1;transition:transform .15s}details[open] summary::after{transform:rotate(90deg)}
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grille label{font-size:12px;color:var(--mut)}.grille .large{grid-column:1/-1}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mods label{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;display:flex;gap:6px;align-items:center}
.mods input{accent-color:var(--acc)}
.actes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.oui{flex:1 1 150px;border:0;background:var(--acc);color:#18181a;border-radius:14px;min-height:48px;font-weight:700}
.non{flex:1 1 110px;border:1px solid var(--line);background:none;border-radius:14px;min-height:48px}

.vide{text-align:center;padding:36px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--mut)}
.vide b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.vide .oui{margin-top:16px;padding:0 22px;flex:none}
.porte{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:8px}
.porte label{display:block;font-size:14px;color:var(--mut);margin-bottom:8px}
.porte .oui{width:100%;margin-top:10px}
.module h2{margin:0 0 4px;font-size:16px;text-transform:capitalize}
.module p{margin:10px 0 2px;font-size:15px}.module div{font-size:14px;color:var(--mut)}
</style>
</head>
<body>
<main>
<header class="haut">
 <img class="logo" src="/icon-192.png" alt="casô" width="36" height="36">
 <div><h1 id="titre">Veille</h1><p id="sync"></p></div>
 <button class="rond" id="collecte" aria-label="Lancer une collecte" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</header>
<section class="porte" id="porte" hidden><label for="cle">Clé du propriétaire</label><input class="champ" id="cle" type="password" autocomplete="off"><button class="oui" id="entrer">Entrer</button></section>
<nav class="modes" id="modes" hidden><button type="button" data-m="veille" aria-pressed="true">Veille</button><button type="button" data-m="saas" aria-pressed="false">casô</button></nav>
<div id="saas" hidden></div>
<div id="app" hidden>
 <div class="tuiles" id="tuiles"></div>
 <div class="barre"><span id="onglets"></span><select id="dom" aria-label="Domaine"></select></div>
</div>
<div class="note" id="msg" role="status" hidden></div>
<div id="liste"></div>
</main>
<script>
'use strict';
(function(){
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

const SRC={bofip:'BOFiP',entreprendre:'Entreprendre',legifrance:'Légifrance',particuliers:'Service-Public',viepublique:'Vie publique',ecologie:'Écologie',cnil:'CNIL'};
const TRI={envoyer:'À envoyer',garder:'À garder',ecarter:'À écarter'};
const TUILES=[['attente','À valider'],['verifier','À vérifier'],['critiques','Critiques'],['echeances','Échéances']],ONGLETS=[['valide','Validés'],['adapter','À adapter dans casô'],['refuse','Refusés']];
const VIDE={attente:['Rien à valider','Tout est traité. La prochaine collecte se fait demain matin.'],verifier:['Rien à vérifier','Aucun texte bloqué.'],critiques:['Aucun texte critique','Rien n\'entre en vigueur dans les 30 jours.'],
 echeances:['Aucune échéance à venir',''],valide:['Aucun texte validé',''],adapter:['Rien à adapter','Aucun texte validé ne touche un module de casô.'],refuse:['Aucun texte refusé','']};
let cle='',T=[],E={modules:[],domaines:[]},vue='attente',dom='',ouvert=decodeURIComponent(location.hash.slice(1)),occupe=false,mode=ouvert==='saas'?'saas':'veille',S=null;
try{cle=sessionStorage.getItem('caso-veille')||''}catch(e){}

 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===404?'Clé refusée.':j.error||'Erreur '+r.status);return j}
function dire(m,ko){const e=$('msg');e.textContent=m||'';e.hidden=!m;e.className='note'+(ko?' ko':'')}

const dans=f=>f.delaiJours>0?' · dans '+f.delaiJours+' j':f.dateVigueur?' · en vigueur':'';
async function charger(){
 try{E=await api('etat');T=await api('textes');if(mode==='saas')S=await api('saas')}catch(e){$('porte').hidden=false;['app','saas','modes','collecte'].forEach(i=>$(i).hidden=true);$('liste').textContent='';$('sync').textContent='';return dire(cle?e.message:'',true)}
 try{sessionStorage.setItem('caso-veille',cle)}catch(e){}
 $('porte').hidden=true;$('modes').hidden=false;const v=mode==='veille';$('app').hidden=!v;$('liste').hidden=!v;$('collecte').hidden=!v;$('saas').hidden=v;$('titre').textContent=v?'Veille':'casô';
 Array.prototype.forEach.call($('modes').children,b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
 if(v)dessiner();else tableau()}
/* le tableau de bord de casô : des nombres seulement, lus sur le serveur */
const OFFRES={artisan_pro:'Artisan pro',artisan:'Artisan',artisan_curieux:'Artisan curieux (essai)',artisan_fin_essai:'Essai terminé',bricoleur_pro:'Bricoleur du dimanche pro',bricoleur:'Bricoleur du dimanche',sans_choix:'Sans mode choisi'};
function tableau(){
 const z=$('saas'),c=S.comptes;z.textContent='';$('sync').textContent='Serveur démarré le '+fr(S.serveur.demarre.slice(0,10))+' · '+S.serveur.memoireMo+' Mo';
 const bloc=(t)=>{const b=el('section','bloc');b.append(el('h2',null,t));z.append(b);return b},nb=(b,L)=>{const g=el('div','chiffres');L.forEach(([n,l])=>{const d=el('div');d.append(el('b',null,n),el('span',null,l));g.append(d)});b.append(g)};
 const li=(b,l,v,sous)=>{const r=el('div','ligne'),g=el('span',null,l);if(sous){g.append(document.createTextNode(' '),el('em',null,sous))}r.append(g,el('span',null,v));b.append(r)};
 const a=bloc('Comptes');nb(a,[[c.total,'Comptes'],[c.actifs7,'Actifs sur 7 jours'],[c.nouveaux7,'Nouveaux sur 7 jours'],[c.essaisFin7,'Essais qui finissent sous 7 jours']]);
 const max=Math.max(1,...c.parJour.map(x=>x.n)),ba=el('div','barres');ba.setAttribute('role','img');ba.setAttribute('aria-label','Nouveaux comptes par jour, 14 derniers jours');
 c.parJour.forEach(x=>{const i=el('i',x.n?null:'zero');i.style.height=Math.round(x.n/max*100)+'%';i.title=fr(x.j)+' : '+x.n;ba.append(i)});
 const ax=el('div','axe');ax.append(el('span',null,fr(c.parJour[0].j).slice(0,5)),el('span',null,'Nouveaux comptes, 14 jours'),el('span',null,fr(c.parJour[c.parJour.length-1].j).slice(0,5)));a.append(ba,ax);
 const o=bloc('Offres');const ko=Object.keys(c.offres).sort((x,y)=>c.offres[y]-c.offres[x]);if(!ko.length)li(o,'Aucun compte pour l\'instant','');ko.forEach(k=>li(o,OFFRES[k]||k,c.offres[k]));
 li(o,'Connexion Google',c.google);li(o,'Connexion Microsoft',c.microsoft);
 const u=bloc('Usage');li(u,'Devis envoyés à signer','' +S.signatures.envoyees7,'7 jours');li(u,'En attente de signature',S.signatures.enAttente);li(u,'Devis signés',S.signatures.signees);
 li(u,'Téléphones avec notifications',S.notifications);li(u,'Comptes d\'équipe',S.equipes);li(u,'Recherches de prix',S.prix.pret?S.prix.jour+' / '+S.prix.limite:'Non activées','aujourd\'hui');
 const h=bloc('Chat');li(h,'Phrases apprises et partagées',S.chat.apprises);if(!S.chat.incomprises.length)li(h,'Phrases non comprises par 3 usagers ou plus',0);
 S.chat.incomprises.forEach(x=>li(h,'« '+x.t+' »',x.n,x.l));
 const w=bloc('Veille');li(w,'Dernière collecte',S.veille.dernierPassage?fr(S.veille.dernierPassage.slice(0,10)):'Aucune');li(w,'Textes à valider',S.veille.aValider);li(w,'Textes à vérifier',S.veille.aVerifier);
 li(w,'Sources',(S.veille.sources||[]).map(s=>SRC[s]||s).join(', '));if(S.veille.erreursDernier)li(w,'Sources en erreur à la dernière collecte',S.veille.erreursDernier)}
const vivant=f=>f.validation!=='refuse';
const VUES={attente:f=>f.validation==='attente'&&!f.bloque,verifier:f=>f.validation==='attente'&&f.bloque,critiques:f=>vivant(f)&&f.priorite==='P0',echeances:f=>vivant(f)&&f.delaiJours>0,
 valide:f=>f.validation==='valide',adapter:f=>f.validation==='valide'&&(f.modules||[]).length>0,refuse:f=>f.validation==='refuse'};
const choisis=()=>T.filter(f=>VUES[vue](f)&&(!dom||(f.domaines||[]).includes(dom)));
function bouton(c,k,cur,contenu){const b=el('button',c);b.type='button';b.setAttribute('aria-pressed',String(cur===k));contenu(b);b.onclick=()=>{vue=k;ouvert='';dessiner()};return b}
function dessiner(){
 const src=(E.sources||[]).map(s=>SRC[s]||s).join(', ');
 $('sync').textContent=E.dernierPassage?'Collecte du '+fr(E.dernierPassage.slice(0,10))+(src?' · '+src:''):'Aucune collecte pour l\'instant';
 const tu=$('tuiles');tu.textContent='';TUILES.forEach(([k,l])=>{const n=T.filter(VUES[k]).length,b=bouton('tuile'+(k==='critiques'&&n?' alerte':''),k,vue,x=>x.append(el('b',null,n),el('span',null,l)));tu.append(b)});
 const on=$('onglets');on.textContent='';ONGLETS.forEach(([k,l])=>on.append(bouton('onglet',k,vue,x=>x.textContent=l)));
 const sd=$('dom');sd.textContent='';[['','Tous les domaines']].concat(Object.keys(DOM).map(k=>[k,DOM[k]])).forEach(([k,l])=>{const o=el('option',null,l);o.value=k;o.selected=k===dom;sd.append(o)});
 if(E.erreursDernier>0&&!$('msg').textContent)dire('À la dernière collecte, '+E.erreursDernier+' source(s) n\'ont pas répondu.',true);
 const L=$('liste');L.textContent='';const C=choisis();
 /* le tri préparé : il ne reste qu'à confirmer */
 if(vue==='attente'&&C.length){const n={envoyer:0,garder:0,ecarter:0};C.forEach(f=>{if(n[f.tri]!=null)n[f.tri]++});
  if(n.envoyer+n.garder+n.ecarter){const t=el('section','carte tri'),p=el('p'),b=el('button','oui','Appliquer le tri');p.append(el('b',null,'Tri prêt'),document.createTextNode(' · '+[n.envoyer?n.envoyer+' à envoyer':'',n.garder?n.garder+' à garder':'',n.ecarter?n.ecarter+' à écarter':''].filter(Boolean).join(' · ')));
   b.onclick=trier;t.append(p,el('small',null,'Ouvre un texte pour changer sa phrase ou son choix avant.'),b);L.append(t)}}
 if(!C.length){const v=el('div','vide'),t=VIDE[vue];v.append(el('b',null,E.dernierPassage?t[0]:'Aucune collecte pour l\'instant'),document.createTextNode(E.dernierPassage?t[1]:'Le serveur en fait une chaque matin. Tu peux lancer la première maintenant.'));
  if(!E.dernierPassage){const b=el('button','oui','Lancer une collecte');b.onclick=collecter;v.append(document.createElement('br'),b)}return void L.append(v)}
 if(vue==='adapter'){const par={};C.forEach(f=>f.modules.forEach(m=>(par[m]=par[m]||[]).push(f)));
  Object.keys(par).sort().forEach(m=>{const c=el('section','carte module');c.style.padding='16px';c.append(el('h2',null,m));
   par[m].forEach(f=>{const p=el('p');p.append(el('span','tag '+f.priorite,f.priorite),document.createTextNode(' '+f.titre));c.append(p,el('div',null,'Application : '+fr(f.dateVigueur)+dans(f)));(f.actions||[]).forEach(a=>c.append(el('div',null,a)))});L.append(c)});return}
 const rang=f=>f.priorite||'P9';C.sort((a,b)=>rang(a)<rang(b)?-1:rang(a)>rang(b)?1:0).forEach(f=>L.append(carte(f)))}
function carte(f){
 const c=el('article','carte'),t=el('button','tete'),e=el('div','etiq');t.type='button';t.setAttribute('aria-expanded',String(ouvert===f.id));
 e.append(el('span','tag '+(f.priorite||''),f.priorite||'—'),el('span','tag',CAT[f.categorie]||f.categorie));
 if(f.bloque)e.append(el('span','tag bl','Bloqué'));else if(f.validation==='attente'&&TRI[f.tri])e.append(el('span','tag tri-'+f.tri,TRI[f.tri]));if(f.lettre&&f.validation==='valide')e.append(el('span','tag env',f.publieLe?'Envoi le '+fr(f.publieLe):'Envoi'));
 t.append(e,el('h2',null,f.titre),el('small',null,(SRC[f.source]||f.source)+' · publié le '+fr(f.datePub)+dans(f)));t.onclick=()=>{ouvert=ouvert===f.id?'':f.id;dessiner()};c.append(t);
 if(ouvert!==f.id)return c;
 const b=el('div','corps');c.append(b);
 if((f.raisons||[]).length)b.append(Object.assign(el('p','resume'),{textContent:'Bloqué : '+f.raisons.join(' ; ')+'.',style:'color:var(--ko)'}));
 if(f.nouvelle)b.append(el('p','resume',f.nouvelle));
 b.append(el('h3',null,'Le texte'));const dl=el('dl','faits'),li=(k,v)=>{if(v==null||v==='')return;const dd=el('dd');if(v instanceof Node)dd.append(v);else dd.textContent=v;dl.append(el('dt',null,k),dd)};
