<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Veille casô</title>
<style>
/* Tableau de bord privé de la veille réglementaire : le propriétaire de casô y valide, corrige ou refuse chaque texte. Rien ne part sans lui. */
:root{--bg:#f2f2ef;--card:#fbfbfa;--soft:#f0f0ed;--ink:#18181a;--mut:#6b6b70;--line:#e2e1dc;--acc:#ffc21a;--ok:#1e7a46;--warn:#9a6700;--ko:#b42318;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1b1b1e;--soft:#232327;--ink:#f1f1ee;--mut:#a3a3a8;--line:#2e2e33;--ok:#4cc38a;--warn:#e3b341;--ko:#ff7a6b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;font-style:normal;color:#18181a;font-size:16px}
.brand span{margin-left:auto;font:12px var(--mono);color:var(--mut);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.nb{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.nb div{background:var(--soft);border-radius:12px;padding:10px 12px}
.nb b{display:block;font-size:24px;line-height:1.1}.nb span{color:var(--mut);font-size:12px}
.fil{display:flex;flex-wrap:wrap;gap:6px}
button,select,input{font:inherit;color:inherit}
.fil button,.pt{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.fil button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go{border:0;background:var(--acc);color:#18181a;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer}
.no{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 16px;cursor:pointer}
.t{cursor:pointer}.t h3{margin:4px 0;font-size:16px;line-height:1.3}
.tag{display:inline-block;font:600 11px var(--mono);border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--mut);margin-right:5px}
.P0{background:var(--ko);color:#fff}.P1{background:var(--warn);color:#fff}.bl{color:var(--ko)}.ok{color:var(--ok)}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:12px 0 0}dt{color:var(--mut);font-size:13px}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ed{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ed select,.ed input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ed label{font-size:13px}.mod{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
#msg{color:var(--mut);min-height:1.5em}a{color:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="brand"><i>c</i>Veille<span id="sync"></span></div>
<section class="card" id="porte"><h2>Clé du propriétaire</h2><div class="ed"><input id="cle" type="password" autocomplete="off" aria-label="Clé"><button class="go" id="entrer">Entrer</button></div></section>
<section class="card" id="haut" hidden><div class="nb" id="nb"></div></section>
<section class="card" id="filtres" hidden><div class="fil" id="vues"></div><div class="fil" id="doms" style="margin-top:8px"></div></section>
<div id="msg"></div>
<div id="liste"></div>
<section id="bas" hidden><button class="no" id="collecte">Lancer une collecte</button></section>
</main>
<script>
'use strict';
(function(){
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const CAT={confirme:'Changement confirmé',echeance:'Échéance à venir',clarification:'Clarification',proposition:'Proposition',non_confirme:'Information non confirmée',aucun:'Aucun changement'};
const DOM={fiscalite:'Fiscalité',facturation:'Facturation',assurance:'Assurance',construction:'Construction',renovation:'Rénovation',urbanisme:'Urbanisme',numerique:'Numérique',donnees:'Protection des données'};
const VUES={attente:'À valider',verifier:'À vérifier',valide:'Validés',adapter:'À adapter dans casô',refuse:'Refusés'};
let cle='',T=[],E={modules:[],domaines:[]},vue='attente',dom='',ouvert='';
try{cle=sessionStorage.getItem('caso-veille')||''}catch(e){}
async function api(chemin,corps){const r=await fetch('/api/veille/'+chemin,{method:corps?'POST':'GET',headers:Object.assign({'x-caso-cle':cle},corps?{'content-type':'application/json'}:{}),body:corps?JSON.stringify(corps):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===404?'Clé refusée.':j.error||'Erreur '+r.status);return j}
function dire(m){$('msg').textContent=m||''}
const fr=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'—';
async function charger(){
 try{E=await api('etat');T=await api('textes')}catch(e){$('porte').hidden=false;['haut','filtres','bas'].forEach(i=>$(i).hidden=true);$('liste').textContent='';return dire(cle?e.message:'')}
 try{sessionStorage.setItem('caso-veille',cle)}catch(e){}
 $('porte').hidden=true;['haut','filtres','bas'].forEach(i=>$(i).hidden=false);dire('');dessiner()}
function choisis(){return T.filter(f=>(!dom||(f.domaines||[]).includes(dom))&&(
 vue==='attente'?f.validation==='attente'&&!f.bloque:vue==='verifier'?f.validation==='attente'&&f.bloque:vue==='adapter'?f.validation==='valide'&&(f.modules||[]).length>0:f.validation===vue))}
function dessiner(){
 $('sync').textContent=E.dernierPassage?'Dernière collecte '+fr(E.dernierPassage.slice(0,10))+' · '+(E.sources||[]).join(', '):'Aucune collecte';
 const att=T.filter(f=>f.validation==='attente'),nb=$('nb');nb.textContent='';
 [[att.filter(f=>!f.bloque).length,'Nouveautés à valider'],[T.filter(f=>f.priorite==='P0'&&f.validation!=='refuse').length,'Critiques'],
  [T.filter(f=>f.validation!=='refuse'&&f.delaiJours>0).length,'Échéances à venir'],[att.filter(f=>f.bloque).length,'À vérifier'],[E.erreurs||0,'Erreurs de collecte']]
  .forEach(([n,l])=>{const d=el('div');d.append(el('b',null,n),el('span',null,l));nb.append(d)});
 const bar=(id,o,cur,set)=>{const b=$(id);b.textContent='';Object.keys(o).forEach(k=>{const x=el('button',null,o[k]);x.setAttribute('aria-pressed',String(cur()===k));x.onclick=()=>{set(cur()===k&&id==='doms'?'':k);dessiner()};b.append(x)})};
 bar('vues',VUES,()=>vue,k=>vue=k);bar('doms',DOM,()=>dom,k=>dom=k);
 const L=$('liste');L.textContent='';const C=choisis();if(!C.length)return void L.append(el('div','card','Rien ici.'));
 if(vue==='adapter'){const par={};C.forEach(f=>f.modules.forEach(m=>(par[m]=par[m]||[]).push(f)));
  Object.keys(par).sort().forEach(m=>{const c=el('section','card');c.append(el('h2',null,m));par[m].forEach(f=>{const p=el('p');p.append(el('span','tag '+f.priorite,f.priorite),document.createTextNode(f.titre+' — '+fr(f.dateVigueur)));c.append(p);(f.actions||[]).forEach(a=>c.append(el('div',null,'· '+a)))});L.append(c)});return}
 C.sort((a,b)=>(a.priorite||'P9')<(b.priorite||'P9')?-1:(a.priorite||'P9')>(b.priorite||'P9')?1:0).forEach(f=>L.append(carte(f)))}
function carte(f){
 const c=el('section','card'),t=el('div','t');t.append(el('span','tag '+(f.priorite||''),f.priorite||'—'),el('span','tag',CAT[f.categorie]||f.categorie),el('span','tag',fr(f.datePub)));
 if(f.bloque)t.append(el('span','tag bl','bloqué'));t.append(el('h3',null,f.titre));t.onclick=()=>{ouvert=ouvert===f.id?'':f.id;dessiner()};c.append(t);
 if(ouvert!==f.id)return c;
 const dl=el('dl'),li=(k,v)=>{const dd=el('dd');if(v instanceof Node)dd.append(v);else dd.textContent=v==null||v===''?'—':v;dl.append(el('dt',null,k),dd)};
 let lien='—';if(/^https:\/\//.test(f.url||'')){lien=el('a',null,f.url);lien.href=f.url;lien.target='_blank';lien.rel='noopener noreferrer'}
 li('Résumé',f.nouvelle);li('Texte officiel',lien);li('Référence',f.numero);li('Articles',(f.articles||[]).join(' ; '));li('Publication',fr(f.datePub));
 li('Application',fr(f.dateVigueur)+(f.delaiJours>0?' (dans '+f.delaiJours+' j)':''));li('Professionnels',(f.pros||[]).join(', '));li('Domaines',(f.domaines||[]).map(d=>DOM[d]||d).join(', '));
 li('Modules casô',(f.modules||[]).join(', '));li('À prévoir',(f.actions||[]).join(' '));if(f.ancienne)li('Version d\'avant',f.ancienne);if((f.raisons||[]).length)li('Bloqué car',f.raisons.join(' ; '));
 li('Source',f.source+' · vérifié le '+fr(f.dateVerif));c.append(dl);
 const ed=el('div','ed'),sc=el('select'),sp=el('select'),dv=el('input');dv.type='date';dv.value=f.dateVigueur||'';
 Object.keys(CAT).filter(k=>k!=='aucun').forEach(k=>{const o=el('option',null,CAT[k]);o.value=k;o.selected=k===f.categorie;sc.append(o)});
 ['P0','P1','P2','P3'].forEach(k=>{const o=el('option',null,k);o.value=k;o.selected=k===f.priorite;sp.append(o)});
 sc.setAttribute('aria-label','Catégorie');sp.setAttribute('aria-label','Priorité');dv.setAttribute('aria-label','Date d\'application');ed.append(sc,sp,dv);c.append(ed);
 const mo=el('div','mod'),cases={};(E.modules||[]).forEach(m=>{const l=el('label'),i=el('input');i.type='checkbox';i.checked=(f.modules||[]).includes(m);cases[m]=i;l.append(i,document.createTextNode(' '+m));mo.append(l)});c.append(mo);
 const act=el('div','ed'),envoyer=async d=>{const co={};if(sc.value!==f.categorie)co.categorie=sc.value;if(sp.value!==f.priorite)co.priorite=sp.value;if(dv.value!==(f.dateVigueur||''))co.dateVigueur=dv.value;
  const ms=Object.keys(cases).filter(m=>cases[m].checked);if(ms.join()!==(f.modules||[]).filter(m=>cases[m]).join())co.modules=ms;
  try{dire('…');await api('decider',{id:f.id,decision:d,corrections:co});ouvert='';await charger()}catch(e){dire(e.message)}};
 const v=el('button','go','Valider'),r=el('button','no','Refuser');v.onclick=()=>envoyer('valide');r.onclick=()=>envoyer('refuse');act.append(v,r);
 if(f.validation!=='attente'){const a=el('button','no','Remettre en attente');a.onclick=()=>envoyer('attente');act.append(a)}
 c.append(act);return c}
$('entrer').onclick=()=>{cle=$('cle').value.trim();$('cle').value='';charger()};
$('cle').onkeydown=e=>{if(e.key==='Enter')$('entrer').click()};
$('collecte').onclick=async()=>{try{dire('Collecte en cours…');const r=await api('passer',{});await charger();dire(r.nouveaux+' nouveau(x), '+r.modifies+' modifié(s), '+r.bloques+' bloqué(s), '+r.erreurs+' erreur(s) de source.')}catch(e){dire(e.message)}};
charger();
})();
</script>
</body>
</html>
