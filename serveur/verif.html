<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Signature casô</title>
<style>
/* Page ouverte par le QR de la signature d'un artisan casô : qui a signé, pour quelle entreprise, et si la signature est valable. */
:root{--bg:#f2f2ef;--card:#fbfbfa;--soft:#f0f0ed;--ink:#18181a;--mut:#6b6b70;--line:#e2e1dc;--acc:#ffc21a;--ok:#1e7a46;--warn:#9a6700;--ko:#b42318;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1b1b1e;--soft:#232327;--ink:#f1f1ee;--mut:#a3a3a8;--line:#2e2e33;--ok:#4cc38a;--warn:#e3b341;--ko:#ff7a6b;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em;padding:4px 2px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;font-style:normal;color:#18181a;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
h2{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.st{display:flex;gap:14px;align-items:center}
.st svg{width:44px;height:44px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.st b{display:block;font-size:20px;line-height:1.2}
.st span{color:var(--mut);font-size:14px}
.st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.st.ko{color:var(--ko)}
.who{font-size:24px;font-weight:700;line-height:1.2;margin:0}
.q{color:var(--mut);margin:2px 0 14px}
.sig{background:#fff;border:1px solid var(--line);border-radius:14px;height:130px;display:grid;place-items:center;padding:10px}
.sig img{max-width:100%;max-height:108px;object-fit:contain}
.co{font-size:20px;font-weight:700;line-height:1.25;margin:0}
.fm{color:var(--mut);margin:2px 0 8px}
.ln{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.ln dt{color:var(--mut)} .ln dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
a{color:var(--ink)} .chk{display:inline-block;margin-top:4px;font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:0;color:var(--mut)}
.foot{text-align:center;font-size:12px;color:var(--mut);font-family:var(--mono)}
.sk{height:16px;border-radius:8px;background:var(--soft);margin:8px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
 <div class="brand"><i aria-hidden="true">ô</i>casô</div>
 <div class="card st" id="st"><div style="flex:1"><div class="sk" style="width:60%"></div><div class="sk" style="width:40%"></div></div></div>
 <section class="card" id="pers" hidden>
  <h2>Signataire</h2>
  <p class="who" id="nom"></p><p class="q" id="qual"></p>
  <div class="sig"><img id="img" alt="Signature"></div>
 </section>
 <section class="card" id="ent" hidden>
  <h2>Entreprise</h2>
  <p class="co" id="co"></p><p class="fm" id="fm"></p>
  <dl id="dl" style="margin:0"></dl>
 </section>
 <p class="foot" id="foot"></p>
</main>
<script>
(function(){
 var ICO={ok:'<circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l2.9 2.9 5.6-6"/>',warn:'<circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.2v.3"/>',ko:'<circle cx="12" cy="12" r="9.5"/><path d="M9 9l6 6M15 9l-6 6"/>'};
 var $=function(i){return document.getElementById(i)};
 var id=decodeURIComponent(location.pathname.split('/').pop()||'');
 function d(iso){var x=new Date(iso);return isNaN(x)?'':x.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Paris'})}
 function status(kind,title,sub){var s=$('st');s.className='card st '+kind;s.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICO[kind]+'</svg><div><b></b><span></span></div>';
  s.querySelector('b').textContent=title;s.querySelector('span').textContent=sub||''}
 function row(label,val,href){if(!val)return;var dt=document.createElement('dt'),dd=document.createElement('dd'),w=document.createElement('div');w.className='ln';
  dt.textContent=label;if(href){var a=document.createElement('a');a.href=href;a.textContent=val;dd.appendChild(a)}else dd.textContent=val;w.appendChild(dt);w.appendChild(dd);$('dl').appendChild(w);return dd}
 $('foot').textContent=id;
 fetch('/api/v/'+encodeURIComponent(id)).then(function(r){return r.ok?r.json():null}).then(function(v){
  if(!v){status('ko','Signature inconnue','Ce QR ne correspond à aucune signature enregistrée dans casô.');return}
  if(v.status==='active')status('ok','Signature vérifiée','Enregistrée le '+d(v.at)+(v.faceid?' avec Face ID':''));
  else status('warn','Signature remplacée','Valable pour les documents signés entre le '+d(v.at)+' et le '+d(v.replacedAt)+'.');
  var s=v.signataire||{},e=v.entreprise||{};
  $('nom').textContent=s.nom||'';$('qual').textContent=[s.qualite,e.nom].filter(Boolean).join(' · ');
  if(v.img&&/^data:image\/png;base64,/.test(v.img))$('img').src=v.img;
  $('pers').hidden=false;
  if(e.nom||e.siret){
   $('co').textContent=e.nom||'';$('fm').textContent=e.forme||'';$('fm').hidden=!e.forme;
   var sd=row('SIRET',e.siret?e.siret.replace(/(\d{3})(\d{3})(\d{3})(\d{5})/,'$1 $2 $3 $4'):'');
   if(sd){sd.className='mono';if(/^\d{14}$/.test(e.siret)){var a=document.createElement('a');a.className='chk';a.href='https://annuaire-entreprises.data.gouv.fr/etablissement/'+e.siret;a.target='_blank';a.rel='noopener';a.textContent='Vérifier sur l’Annuaire des entreprises';sd.appendChild(document.createElement('br'));sd.appendChild(a)}}
   row('Adresse',e.adresse);row('Téléphone',e.tel,e.tel?'tel:'+e.tel.replace(/[^\d+]/g,''):null);row('E-mail',e.email,e.email?'mailto:'+e.email:null);
   row('RM / RCS',e.rm);row('Assurance',e.assur);
   $('ent').hidden=false}
 }).catch(function(){status('ko','Vérification impossible','Pas de connexion. Réessayez dans un instant.')});
})();
</script>
</body>
</html>
